<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shiv Supplements - Admin Dashboard</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#090b10;
  color:#fff;
  min-height:100vh;
}

/* HEADER */

.header{
  background:#11151d;
  border-bottom:2px solid #ffb000;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#ffb000;
}

.admin{
  color:#aaa;
  font-size:14px;
}

/* CONTAINER */

.container{
  width:92%;
  max-width:1400px;
  margin:30px auto;
}

.title{
  font-size:32px;
  margin-bottom:25px;
}

.title span{
  color:#ffb000;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:30px;
}

.card{
  background:#151c27;
  border:1px solid #263447;
  border-radius:16px;
  padding:24px;
}

.card h3{
  color:#aaa;
  font-size:15px;
  margin-bottom:12px;
}

.card .number{
  font-size:30px;
  font-weight:bold;
}

/* CONTROLS */

.controls{
  display:flex;
  gap:12px;
  margin-bottom:20px;
}

input{
  flex:1;
  background:#111722;
  color:white;
  border:1px solid #33445b;
  padding:14px;
  border-radius:10px;
  outline:none;
}

button{
  border:none;
  border-radius:10px;
  padding:13px 20px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
  opacity:.9;
}

.refresh{
  background:#ffb000;
  color:#111;
}

/* ORDERS */

.orders{
  background:#111722;
  border:1px solid #263447;
  border-radius:16px;
  overflow:hidden;
}

.order{
  padding:22px;
  border-bottom:1px solid #263447;
}

.order:last-child{
  border-bottom:none;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.order-id{
  font-weight:bold;
  color:#ffb000;
}

.customer{
  margin-top:15px;
  line-height:1.8;
  color:#ddd;
}

.products{
  margin-top:15px;
  padding:15px;
  background:#0b0f16;
  border-radius:10px;
}

.product{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid #202a38;
}

.product:last-child{
  border-bottom:none;
}

.amount{
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
  color:#ffb000;
}

/* STATUS */

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#4b3500;
  color:#ffc400;
}

.paid{
  background:#063d27;
  color:#37e69a;
}

.processing{
  background:#26365b;
  color:#7db4ff;
}

.shipped{
  background:#073b58;
  color:#55c7ff;
}

.delivered{
  background:#233b12;
  color:#9cff50;
}

.cancelled{
  background:#4a1111;
  color:#ff6b6b;
}

/* ACTIONS */

.actions{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #263447;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.action-title{
  width:100%;
  color:#aaa;
  font-size:13px;
  margin-bottom:3px;
}

.approve-btn{
  background:#ffb000;
  color:#111;
}

.reject-btn{
  background:#4a1111;
  color:#ff6b6b;
  border:1px solid #ff6b6b;
}

.processing-btn{
  background:#26365b;
  color:#7db4ff;
}

.ship-btn{
  background:#073b58;
  color:#55c7ff;
}

.deliver-btn{
  background:#233b12;
  color:#9cff50;
}

.disabled-btn{
  opacity:.45;
  cursor:not-allowed;
}

/* EMPTY / LOADING */

.empty{
  text-align:center;
  padding:60px 20px;
  color:#888;
}

.loading{
  text-align:center;
  padding:40px;
  color:#aaa;
}

/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:9999;
  background:#151c27;
  border:1px solid #ffb000;
  color:white;
  padding:15px 20px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  display:none;
  max-width:350px;
}

.toast.show{
  display:block;
}


/* PRODUCTS / INVENTORY */
.productPanel{
  background:#111722;
  border:1px solid #263447;
  border-radius:16px;
  padding:22px;
  margin-bottom:30px;
}
.productPanel h2{margin-bottom:16px}
.productForm{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.productForm .full{grid-column:1/-1}
.productForm input,.productForm select,.productForm textarea{
  width:100%;
  background:#0b1017;
  color:#fff;
  border:1px solid #33445b;
  padding:12px;
  border-radius:10px;
  outline:none;
}
.productForm textarea{min-height:80px;resize:vertical}
.productActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.addProductBtn{background:#ffb000;color:#111}
.cancelProductBtn{background:#263447;color:#fff}
.productGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:18px;
}
.productAdminCard{
  background:#0b1017;
  border:1px solid #263447;
  border-radius:14px;
  padding:15px;
}
.productAdminTop{display:flex;gap:12px}
.productAdminImage{
  width:72px;height:72px;border-radius:10px;object-fit:cover;
  background:#151c27;border:1px solid #303b4d;
}
.productAdminName{font-weight:900}
.productAdminBrand{color:#ffcf52;font-size:12px;margin-top:4px}
.productMeta{color:#aab4c3;font-size:12px;line-height:1.6;margin-top:10px}
.stockGood{color:#53e39a}.stockLow{color:#ffd15c}.stockOut{color:#ff777f}
.smallBtn{padding:8px 11px;font-size:12px;background:#202b3b;color:#fff}
.deleteBtn{background:#4a1111;color:#ff8a8a}
.editing{border-color:#ffb000}
@media(max-width:1000px){.productGrid{grid-template-columns:repeat(2,1fr)}.productForm{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.productGrid,.productForm{grid-template-columns:1fr}.productForm .full{grid-column:auto}}


/* ADMIN LOGIN */
#adminLoginScreen{
  position:fixed;
  inset:0;
  z-index:100000;
  background:#070b10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.adminLoginBox{
  width:min(420px,100%);
  background:#111722;
  border:1px solid #34445b;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 70px rgba(0,0,0,.55);
}
.adminLoginLogo{
  text-align:center;
  font-size:26px;
  font-weight:1000;
  letter-spacing:2px;
  margin-bottom:6px;
}
.adminLoginLogo span{color:#ffb000}
.adminLoginSub{
  text-align:center;
  color:#8e9aaa;
  font-size:13px;
  margin-bottom:24px;
}
.adminLoginBox label{
  display:block;
  color:#c8d0dc;
  font-size:13px;
  margin:12px 0 7px;
}
.adminLoginBox input{
  width:100%;
  background:#0b1017;
  color:#fff;
  border:1px solid #33445b;
  padding:13px;
  border-radius:10px;
  outline:none;
}
.adminLoginBox input:focus{border-color:#ffb000}
.adminLoginBtn{
  width:100%;
  margin-top:18px;
  background:#ffb000;
  color:#111;
  border:0;
  padding:13px;
  border-radius:10px;
  font-weight:900;
  cursor:pointer;
}
.adminLoginBtn:disabled{opacity:.6;cursor:wait}
#adminLoginError{
  display:none;
  margin-top:12px;
  color:#ff8d8d;
  font-size:13px;
  text-align:center;
}
#adminApp{display:none}

/* MOBILE */

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .controls{
    flex-direction:column;
  }

  .title{
    font-size:25px;
  }

  .header{
    gap:10px;
    flex-direction:column;
    align-items:flex-start;
  }

  .actions button{
    flex:1;
  }

}

</style>

</head>


<body>

<div id="adminLoginScreen">
  <div class="adminLoginBox">
    <div class="adminLoginLogo">SHIV <span>SUPPLEMENTS</span></div>
    <div class="adminLoginSub">🔐 Secure Admin Dashboard</div>

    <label>Admin Username</label>
    <input id="adminUsername" type="text" autocomplete="username" placeholder="Enter admin username">

    <label>Admin Password</label>
    <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Enter admin password">

    <button class="adminLoginBtn" id="adminLoginBtn" onclick="adminLogin()">
      🔐 Login to Admin
    </button>

    <div id="adminLoginError"></div>
  </div>
</div>

<div id="adminApp">


<header class="header">

  <div class="logo">
    SHIV <span>SUPPLEMENTS</span>
  </div>

  <div class="admin">
    ADMIN DASHBOARD
    <button id="adminLogoutBtn" onclick="adminLogout()" style="margin-left:12px;background:#35151a;color:#ff9b9b;border:1px solid #6b252c;border-radius:8px;padding:7px 10px;cursor:pointer">
      Logout
    </button>
  </div>

</header>


<div class="container">

  <h1 class="title">
    📦 Admin <span>Orders</span>
  </h1>


  <section class="productPanel">
    <h2>🛍️ Products & <span style="color:#ffb000">Inventory</span></h2>
    <div class="productForm" id="productForm">
      <input id="pBrand" placeholder="Brand e.g. MuscleBlaze">
      <input id="pName" placeholder="Product name">
      <select id="pCategory">
        <option value="Whey Protein">Whey Protein</option>
        <option value="Creatine">Creatine</option>
        <option value="Mass Gainer">Mass Gainer</option>
        <option value="Pre-Workout">Pre-Workout</option>
        <option value="Vitamins">Vitamins</option>
        <option value="Omega">Omega</option>
        <option value="Other">Other</option>
      </select>
      <input id="pFlavor" placeholder="Flavour">
      <input id="pSize" placeholder="Size e.g. 1 kg / 250 g">
      <input id="pMrp" type="number" min="0" step="0.01" placeholder="MRP ₹">
      <input id="pPrice" type="number" min="0" step="0.01" placeholder="Selling Price ₹">
      <input id="pStock" type="number" min="0" step="1" placeholder="Stock quantity">
      <input id="pImage" placeholder="Product image URL (optional)">
      <textarea id="pDescription" class="full" placeholder="Short product description"></textarea>
    </div>
    <div class="productActions">
      <button class="addProductBtn" id="saveProductBtn" onclick="saveProduct()">➕ Add Product</button>
      <button class="cancelProductBtn" id="cancelEditBtn" onclick="cancelProductEdit()" style="display:none">Cancel Edit</button>
    </div>
    <div id="productMsg" style="margin-top:10px;color:#aaa"></div>
    <div class="productGrid" id="productGrid">
      <div class="loading">Loading products...</div>
    </div>
  </section>



  <!-- STATS -->

  <div class="stats">

    <div class="card">
      <h3>Total Orders</h3>
      <div class="number" id="totalOrders">0</div>
    </div>

    <div class="card">
      <h3>Pending</h3>
      <div class="number" id="pendingOrders">0</div>
    </div>

    <div class="card">
      <h3>Paid</h3>
      <div class="number" id="paidOrders">0</div>
    </div>

    <div class="card">
      <h3>Total Sales</h3>
      <div class="number" id="totalSales">₹0</div>
    </div>

  </div>


  <!-- SEARCH -->

  <div class="controls">

    <input
      type="text"
      id="search"
      placeholder="Search customer, phone, email or order ID..."
      oninput="renderOrders()"
    >

    <button
      class="refresh"
      onclick="loadOrders()"
    >
      🔄 Refresh Orders
    </button>

  </div>


  <!-- ORDERS -->

  <div class="orders" id="orders">

    <div class="loading">
      Loading orders...
    </div>

  </div>

</div>


<!-- TOAST -->

<div id="toast" class="toast"></div>


<script>

let allOrders = [];




/* =====================================================
   ADMIN AUTHENTICATION
===================================================== */
async function checkAdminSession(){
  try{
    const response = await fetch("/api/admin/me", {cache:"no-store"});
    const data = await response.json();
    if(data.loggedIn){
      showAdminApp();
    }else{
      showAdminLogin();
    }
  }catch(error){
    console.error("ADMIN SESSION ERROR:", error);
    showAdminLogin();
  }
}

function showAdminLogin(){
  const login=document.getElementById("adminLoginScreen");
  const app=document.getElementById("adminApp");
  if(login) login.style.display="flex";
  if(app) app.style.display="none";
}

function showAdminApp(){
  const login=document.getElementById("adminLoginScreen");
  const app=document.getElementById("adminApp");
  if(login) login.style.display="none";
  if(app) app.style.display="block";
  loadProducts();
  loadOrders();
}

async function adminLogin(){
  const username=(document.getElementById("adminUsername")?.value||"").trim();
  const password=document.getElementById("adminPassword")?.value||"";
  const btn=document.getElementById("adminLoginBtn");
  const error=document.getElementById("adminLoginError");

  if(!username || !password){
    if(error){
      error.textContent="Please enter both username and password.";
      error.style.display="block";
    }
    return;
  }

  if(btn){
    btn.disabled=true;
    btn.textContent="Logging in...";
  }
  if(error) error.style.display="none";

  try{
    const response=await fetch("/api/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"same-origin",
      body:JSON.stringify({username,password})
    });
    const data=await response.json();

    if(!response.ok || data.success===false){
      throw new Error(data.message||"Invalid admin credentials");
    }

    document.getElementById("adminPassword").value="";
    showAdminApp();
  }catch(err){
    console.error("ADMIN LOGIN ERROR:",err);
    if(error){
      error.textContent=err.message||"Admin login failed.";
      error.style.display="block";
    }
  }finally{
    if(btn){
      btn.disabled=false;
      btn.textContent="🔐 Login to Admin";
    }
  }
}

async function adminLogout(){
  try{
    await fetch("/api/admin/logout",{
      method:"POST",
      credentials:"same-origin"
    });
  }catch(error){
    console.error(error);
  }
  showAdminLogin();
  document.getElementById("adminUsername").value="";
  document.getElementById("adminPassword").value="";
}

document.addEventListener("DOMContentLoaded",()=>{
  const pass=document.getElementById("adminPassword");
  if(pass){
    pass.addEventListener("keydown",(event)=>{
      if(event.key==="Enter") adminLogin();
    });
  }
  checkAdminSession();
});


/* =====================================================
   PRODUCTS / INVENTORY
===================================================== */
let allProducts = [];
let editingProductId = null;

function productVal(id){ return (document.getElementById(id)?.value || "").trim(); }
function setProductVal(id,value){ const el=document.getElementById(id); if(el) el.value=value ?? ""; }

async function loadProducts(){
  const grid=document.getElementById("productGrid");
  if(grid) grid.innerHTML='<div class="loading">Loading products...</div>';
  try{
    const response=await fetch("/api/admin/products",{cache:"no-store"});
    const data=await response.json();
    if(!response.ok) throw new Error(data.message||"Could not load products");
    allProducts=Array.isArray(data.products)?data.products:[];
    renderProductsAdmin();
  }catch(error){
    console.error("PRODUCT LOAD ERROR:",error);
    if(grid) grid.innerHTML='<div class="empty">❌ Could not load products.<br><small>'+escapeHTML(error.message)+'</small></div>';
  }
}

function renderProductsAdmin(){
  const grid=document.getElementById("productGrid");
  if(!grid)return;
  if(!allProducts.length){
    grid.innerHTML='<div class="empty">No products yet. Add your first supplement above.</div>';
    return;
  }
  grid.innerHTML=allProducts.map(p=>{
    const stock=Number(p.stock||0);
    const stockClass=stock<=0?"stockOut":stock<=5?"stockLow":"stockGood";
    const img=p.image?`<img class="productAdminImage" src="${escapeHTML(p.image)}" alt="" onerror="this.style.display='none'">`:`<div class="productAdminImage"></div>`;
    return `
      <div class="productAdminCard ${editingProductId===p.id?'editing':''}">
        <div class="productAdminTop">
          ${img}
          <div>
            <div class="productAdminBrand">${escapeHTML(p.brand)}</div>
            <div class="productAdminName">${escapeHTML(p.name)}</div>
            <div style="color:#aaa;font-size:12px">${escapeHTML(p.size||"")} ${p.flavor?"• "+escapeHTML(p.flavor):""}</div>
          </div>
        </div>
        <div class="productMeta">
          Category: ${escapeHTML(p.category)}<br>
          MRP: ₹${Number(p.mrp).toLocaleString("en-IN")} &nbsp; Selling: <b style="color:#ffcf52">₹${Number(p.price).toLocaleString("en-IN")}</b><br>
          Discount: <b>${Number(p.discount||0)}%</b> &nbsp; Stock: <b class="${stockClass}">${stock}</b>
        </div>
        <div class="productActions">
          <button class="smallBtn" onclick="editProduct(${p.id})">✏️ Edit</button>
          <button class="smallBtn" onclick="toggleProduct(${p.id})">${p.active?"🙈 Hide":"👁️ Show"}</button>
          <button class="smallBtn deleteBtn" onclick="deleteProduct(${p.id})">🗑️ Delete</button>
        </div>
      </div>
    `;
  }).join("");
}

async function saveProduct(){
  const payload={
    brand:productVal("pBrand"),
    name:productVal("pName"),
    category:productVal("pCategory"),
    flavor:productVal("pFlavor"),
    size:productVal("pSize"),
    mrp:Number(productVal("pMrp")),
    price:Number(productVal("pPrice")),
    stock:Number(productVal("pStock")),
    image:productVal("pImage"),
    description:productVal("pDescription")
  };
  if(!payload.brand||!payload.name||!payload.category){
    alert("Brand, product name and category are required.");
    return;
  }
  if(!Number.isFinite(payload.mrp)||!Number.isFinite(payload.price)||payload.mrp<0||payload.price<0){
    alert("Enter valid MRP and selling price.");
    return;
  }
  if(payload.price>payload.mrp && payload.mrp>0){
    alert("Selling price cannot be greater than MRP.");
    return;
  }
  if(!Number.isFinite(payload.stock)||payload.stock<0){
    alert("Enter a valid stock quantity.");
    return;
  }

  const btn=document.getElementById("saveProductBtn");
  btn.disabled=true;
  try{
    const url=editingProductId?"/api/admin/products/"+encodeURIComponent(editingProductId):"/api/admin/products";
    const method=editingProductId?"PATCH":"POST";
    const response=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data=await response.json();
    if(!response.ok) throw new Error(data.message||"Could not save product");
    showToast(editingProductId?"✅ Product updated":"✅ Product added");
    cancelProductEdit();
    await loadProducts();
  }catch(error){
    console.error(error);
    alert("❌ "+error.message);
  }finally{
    btn.disabled=false;
  }
}

function editProduct(id){
  const p=allProducts.find(x=>Number(x.id)===Number(id));
  if(!p)return;
  editingProductId=Number(id);
  setProductVal("pBrand",p.brand);
  setProductVal("pName",p.name);
  setProductVal("pCategory",p.category);
  setProductVal("pFlavor",p.flavor);
  setProductVal("pSize",p.size);
  setProductVal("pMrp",p.mrp);
  setProductVal("pPrice",p.price);
  setProductVal("pStock",p.stock);
  setProductVal("pImage",p.image);
  setProductVal("pDescription",p.description);
  document.getElementById("saveProductBtn").textContent="💾 Update Product";
  document.getElementById("cancelEditBtn").style.display="inline-block";
  document.getElementById("productForm").scrollIntoView({behavior:"smooth",block:"center"});
  renderProductsAdmin();
}

function cancelProductEdit(){
  editingProductId=null;
  ["pBrand","pName","pFlavor","pSize","pMrp","pPrice","pStock","pImage","pDescription"].forEach(id=>setProductVal(id,""));
  setProductVal("pCategory","Whey Protein");
  const btn=document.getElementById("saveProductBtn");
  if(btn)btn.textContent="➕ Add Product";
  const cancel=document.getElementById("cancelEditBtn");
  if(cancel)cancel.style.display="none";
  renderProductsAdmin();
}

async function toggleProduct(id){
  const p=allProducts.find(x=>Number(x.id)===Number(id));
  if(!p)return;
  try{
    const response=await fetch("/api/admin/products/"+encodeURIComponent(id),{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({...p,active:!p.active})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.message||"Could not update product");
    await loadProducts();
  }catch(error){alert("❌ "+error.message);}
}

async function deleteProduct(id){
  if(!confirm("Delete this product? Existing orders will remain unchanged."))return;
  try{
    const response=await fetch("/api/admin/products/"+encodeURIComponent(id),{method:"DELETE"});
    const data=await response.json();
    if(!response.ok)throw new Error(data.message||"Could not delete product");
    showToast("🗑️ Product deleted");
    await loadProducts();
  }catch(error){alert("❌ "+error.message);}
}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  const toast = document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

  const box = document.getElementById("orders");

  box.innerHTML = `
    <div class="loading">
      Loading orders...
    </div>
  `;

  try{

    const response = await fetch("/api/admin/orders");

    if(!response.ok){
      throw new Error("Server error");
    }

    const data = await response.json();

    if(Array.isArray(data)){

      allOrders = data;

    }
    else{

      allOrders = data.orders || [];

    }

    updateStats();

    renderOrders();

  }
  catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="empty">
        ❌ Could not load orders.
        <br><br>
        Please refresh the page.
      </div>
    `;

  }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const total = allOrders.length;


  const pending = allOrders.filter(o => {

    const s = String(
      o.status ||
      o.payment_status ||
      ""
    ).toLowerCase();

    return s === "pending";

  }).length;


  const paid = allOrders.filter(o => {

    const s = String(
      o.status ||
      o.payment_status ||
      ""
    ).toLowerCase();

    return s === "paid";

  }).length;


  let sales = 0;


  allOrders.forEach(o => {

    const amount =
      Number(
        o.total ||
        o.amount ||
        o.total_amount ||
        o.price ||
        0
      );

    sales += amount;

  });


  document.getElementById("totalOrders").textContent =
    total;


  document.getElementById("pendingOrders").textContent =
    pending;


  document.getElementById("paidOrders").textContent =
    paid;


  document.getElementById("totalSales").textContent =
    "₹" + sales.toLocaleString("en-IN");

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(){

  const box = document.getElementById("orders");


  const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();


  const filtered = allOrders.filter(order => {

    const text =
      JSON.stringify(order)
      .toLowerCase();

    return text.includes(search);

  });


  if(filtered.length === 0){

    box.innerHTML = `
      <div class="empty">
        📭 No orders found.
      </div>
    `;

    return;

  }


  box.innerHTML = filtered.map((order,index) => {


    /* ORDER ID */

    const orderId =
      order.order_id ||
      order.id ||
      order._id ||
      ("ORDER-" + (index + 1));


    /* CUSTOMER */

    const name =
      order.name ||
      order.customer_name ||
      order.customerName ||
      "Customer";


    const phone =
      order.phone ||
      order.mobile ||
      order.customer_phone ||
      "-";


    const email =
      order.email ||
      order.customer_email ||
      "-";


    const address =
      order.address ||
      order.delivery_address ||
      "-";


    /* STATUS */

    const status =
      String(
        order.status ||
        order.payment_status ||
        "pending"
      ).toLowerCase();


    /* AMOUNT */

    const amount =
      Number(
        order.total ||
        order.amount ||
        order.total_amount ||
        order.price ||
        0
      );


    /* PRODUCTS */

    const products =
      order.items ||
      order.products ||
      [];


    let productHTML = "";


    if(Array.isArray(products) && products.length){

      productHTML = products.map(p => {


        const pname =
          p.name ||
          p.title ||
          p.product_name ||
          "Product";


        const qty =
          p.qty ||
          p.quantity ||
          1;


        const price =
          Number(
            p.price ||
            p.amount ||
            0
          );


        return `

          <div class="product">

            <span>
              ${escapeHTML(pname)}
              × ${escapeHTML(String(qty))}
            </span>

            <span>
              ₹${price.toLocaleString("en-IN")}
            </span>

          </div>

        `;

      }).join("");

    }
    else{

      productHTML = `

        <div class="product">

          <span>
            Order items
          </span>

          <span>
            View order data
          </span>

        </div>

      `;

    }


    /* ACTION BUTTONS */

    let actionHTML = "";


    if(status === "pending"){

      actionHTML = `

        <div class="actions">

          <div class="action-title">
            💳 Payment Action
          </div>

          <button
            class="approve-btn"
            onclick="updateOrderStatus('${escapeJS(String(orderId))}','paid')"
          >
            ✅ Approve Payment
          </button>

          <button
            class="reject-btn"
            onclick="updateOrderStatus('${escapeJS(String(orderId))}','cancelled')"
          >
            ❌ Reject
          </button>

        </div>

      `;

    }


    else if(status === "paid"){

      actionHTML = `

        <div class="actions">

          <div class="action-title">
            📦 Order Processing
          </div>

          <button
            class="processing-btn"
            onclick="updateOrderStatus('${escapeJS(String(orderId))}','processing')"
          >
            ⚙️ Mark Processing
          </button>

          <button
            class="ship-btn"
            onclick="updateOrderStatus('${escapeJS(String(orderId))}','shipped')"
          >
            🚚 Mark Shipped
          </button>

          <button
            class="reject-btn"
            onclick="updateOrderStatus('${escapeJS(String(orderId))}','cancelled')"
          >
            ❌ Cancel
          </button>

        </div>

      `;

    }


    else if(status === "processing"){

      actionHTML = `

        <div class="actions">

          <div class="action-title">
            📦 Order Processing
          </div>

          <button
            class="ship-btn"
            onclick="updateOrderStatus('${escapeJS(String(orderId))}','shipped')"
          >
            🚚 Mark Shipped
          </button>

          <button
            class="reject-btn"
            onclick="updateOrderStatus('${escapeJS(String(orderId))}','cancelled')"
          >
            ❌ Cancel
          </button>

        </div>

      `;

    }


    else if(status === "shipped"){

      actionHTML = `

        <div class="actions">

          <div class="action-title">
            🚚 Delivery
          </div>

          <button
            class="deliver-btn"
            onclick="updateOrderStatus('${escapeJS(String(orderId))}','delivered')"
          >
            ✅ Mark Delivered
          </button>

        </div>

      `;

    }


    else if(status === "delivered"){

      actionHTML = `

        <div class="actions">

          <div class="action-title">
            ✅ Order Completed
          </div>

          <button
            class="deliver-btn disabled-btn"
            disabled
          >
            ✓ Delivered
          </button>

        </div>

      `;

    }


    else if(
      status === "cancelled" ||
      status === "canceled"
    ){

      actionHTML = `

        <div class="actions">

          <div class="action-title">
            ❌ Order Cancelled
          </div>

          <button
            class="reject-btn disabled-btn"
            disabled
          >
            Cancelled
          </button>

        </div>

      `;

    }


    return `

      <div class="order">


        <!-- TOP -->

        <div class="order-top">

          <div>

            <div class="order-id">

              Order #${escapeHTML(String(orderId))}

            </div>


            <div
              style="color:#777;margin-top:5px"
            >

              ${formatDate(
                order.created_at ||
                order.createdAt ||
                order.date
              )}

            </div>

          </div>


          <div>

            <span
              class="status ${statusClass(status)}"
            >

              ${escapeHTML(status.toUpperCase())}

            </span>

          </div>

        </div>


        <!-- CUSTOMER -->

        <div class="customer">

          👤
          <b>
            ${escapeHTML(String(name))}
          </b>

          <br>

          📱
          ${escapeHTML(String(phone))}

          <br>

          📧
          ${escapeHTML(String(email))}

          <br>

          📍
          ${escapeHTML(String(address))}

        </div>


        <!-- PRODUCTS -->

        <div class="products">

          <b>
            🛒 Products
          </b>

          <div style="margin-top:10px">

            ${productHTML}

          </div>

        </div>


        <!-- AMOUNT -->

        <div class="amount">

          Total:
          ₹${amount.toLocaleString("en-IN")}

        </div>


        <!-- ACTIONS -->

        ${actionHTML}


      </div>

    `;

  }).join("");

}


/* =====================================================
   UPDATE ORDER STATUS
===================================================== */

async function updateOrderStatus(orderId,status){

  let message = "";


  if(status === "paid"){

    message =
      "Approve this payment?\n\n" +
      "The order will be marked as PAID.";

  }

  else if(status === "cancelled"){

    message =
      "Reject/cancel this order?";

  }

  else if(status === "processing"){

    message =
      "Mark this order as PROCESSING?";

  }

  else if(status === "shipped"){

    message =
      "Mark this order as SHIPPED?";

  }

  else if(status === "delivered"){

    message =
      "Mark this order as DELIVERED?";

  }


  if(!confirm(message)){

    return;

  }


  try{


    showToast("Updating order...");


    const response =
      await fetch(
        "/api/admin/orders/" +
        encodeURIComponent(orderId),
        {
          method:"PATCH",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            status:status
          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        "Could not update order"
      );

    }


    if(data.success === false){

      throw new Error(
        data.message ||
        "Could not update order"
      );

    }


    if(status === "paid"){

      showToast(
        "✅ Payment approved successfully!"
      );

    }

    else if(status === "cancelled"){

      showToast(
        "❌ Order cancelled."
      );

    }

    else if(status === "processing"){

      showToast(
        "⚙️ Order marked as processing."
      );

    }

    else if(status === "shipped"){

      showToast(
        "🚚 Order marked as shipped."
      );

    }

    else if(status === "delivered"){

      showToast(
        "✅ Order marked as delivered."
      );

    }


    /* RELOAD */

    await loadProducts();


  }
  catch(error){

    console.error(
      "UPDATE ORDER ERROR:",
      error
    );


    alert(
      "❌ Update failed.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(status){

  if(status === "paid")
    return "paid";


  if(status === "processing")
    return "processing";


  if(status === "shipped")
    return "shipped";


  if(status === "delivered")
    return "delivered";


  if(
    status === "cancelled" ||
    status === "canceled"
  )
    return "cancelled";


  return "pending";

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value){

    return "";

  }


  try{

    return new Date(value)
      .toLocaleString(
        "en-IN",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );

  }
  catch{

    return String(value);

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJS(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}

   START
