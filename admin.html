<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shiv Supplements - Admin Dashboard</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#090b10;
  color:#fff;
  min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
  background:#11151d;
  border-bottom:2px solid #ffb000;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#ffb000;
}

.admin-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.admin-label{
  color:#aaa;
  font-size:14px;
}

.logout-btn{
  background:#4a1111;
  color:#ff7777;
  border:1px solid #ff5555;
}

/* =========================
   CONTAINER
========================= */

.container{
  width:92%;
  max-width:1400px;
  margin:30px auto;
}

.title{
  font-size:32px;
  margin-bottom:25px;
}

.title span{
  color:#ffb000;
}

/* =========================
   LOGIN
========================= */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:430px;
  background:#151c27;
  border:1px solid #33445b;
  border-radius:18px;
  padding:35px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.login-logo{
  text-align:center;
  font-size:28px;
  font-weight:900;
  margin-bottom:8px;
}

.login-logo span{
  color:#ffb000;
}

.login-title{
  text-align:center;
  color:#aaa;
  margin-bottom:30px;
}

.login-box input{
  width:100%;
  margin-bottom:15px;
}

.login-btn{
  width:100%;
  background:#ffb000;
  color:#111;
  font-size:16px;
}

.login-error{
  display:none;
  background:#4a1111;
  color:#ff7777;
  border:1px solid #ff5555;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:30px;
}

.card{
  background:#151c27;
  border:1px solid #263447;
  border-radius:16px;
  padding:24px;
}

.card h3{
  color:#aaa;
  font-size:15px;
  margin-bottom:12px;
}

.card .number{
  font-size:30px;
  font-weight:bold;
}

/* =========================
   CONTROLS
========================= */

.controls{
  display:flex;
  gap:12px;
  margin-bottom:20px;
}

input{
  flex:1;
  background:#111722;
  color:white;
  border:1px solid #33445b;
  padding:14px;
  border-radius:10px;
  outline:none;
}

input:focus{
  border-color:#ffb000;
}

button{
  border:none;
  border-radius:10px;
  padding:13px 20px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
  opacity:.9;
}

.refresh{
  background:#ffb000;
  color:#111;
}

/* =========================
   ORDERS
========================= */

.orders{
  background:#111722;
  border:1px solid #263447;
  border-radius:16px;
  overflow:hidden;
}

.order{
  padding:22px;
  border-bottom:1px solid #263447;
}

.order:last-child{
  border-bottom:none;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.order-id{
  font-weight:bold;
  color:#ffb000;
  font-size:18px;
}

.customer{
  margin-top:15px;
  line-height:1.8;
  color:#ddd;
}

.products{
  margin-top:15px;
  padding:15px;
  background:#0b0f16;
  border-radius:10px;
}

.product{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid #202a38;
}

.product:last-child{
  border-bottom:none;
}

.amount{
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
  color:#ffb000;
}

.payment{
  margin-top:15px;
  background:#151c27;
  border:1px solid #263447;
  border-radius:10px;
  padding:14px;
}

.payment-title{
  color:#aaa;
  font-size:13px;
  margin-bottom:7px;
}

.payment-ref{
  color:#fff;
  font-weight:bold;
  word-break:break-all;
}

/* =========================
   STATUS
========================= */

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#4b3500;
  color:#ffc400;
}

.paid{
  background:#063d27;
  color:#37e69a;
}

.processing{
  background:#26365b;
  color:#7db4ff;
}

.shipped{
  background:#073b58;
  color:#55c7ff;
}

.delivered{
  background:#233b12;
  color:#9cff50;
}

.cancelled{
  background:#4a1111;
  color:#ff6b6b;
}

/* =========================
   ACTIONS
========================= */

.actions{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #263447;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.action-title{
  width:100%;
  color:#aaa;
  font-size:13px;
  margin-bottom:3px;
}

.approve-btn{
  background:#ffb000;
  color:#111;
}

.reject-btn{
  background:#4a1111;
  color:#ff6b6b;
  border:1px solid #ff6b6b;
}

.processing-btn{
  background:#26365b;
  color:#7db4ff;
}

.ship-btn{
  background:#073b58;
  color:#55c7ff;
}

.deliver-btn{
  background:#233b12;
  color:#9cff50;
}

.disabled-btn{
  opacity:.45;
  cursor:not-allowed;
}

/* =========================
   LOADING / EMPTY
========================= */

.empty{
  text-align:center;
  padding:60px 20px;
  color:#888;
}

.loading{
  text-align:center;
  padding:40px;
  color:#aaa;
}

/* =========================
   ERROR
========================= */

.server-error{
  margin:20px;
  padding:18px;
  background:#4a1111;
  border:1px solid #ff5555;
  border-radius:12px;
  color:#ff9999;
}

.server-error b{
  color:#fff;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:9999;
  background:#151c27;
  border:1px solid #ffb000;
  color:white;
  padding:15px 20px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  display:none;
  max-width:350px;
}

.toast.show{
  display:block;
}

/* =========================
   HIDDEN
========================= */

.hidden{
  display:none !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .controls{
    flex-direction:column;
  }

  .title{
    font-size:25px;
  }

  .header{
    gap:10px;
    flex-direction:column;
    align-items:flex-start;
  }

  .admin-area{
    width:100%;
    justify-content:space-between;
  }

  .actions button{
    flex:1;
  }

  .login-box{
    padding:25px;
  }

}

</style>
</head>

<body>

<!-- =====================================================
     LOGIN SCREEN
===================================================== -->

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <div class="login-logo">
      SHIV <span>SUPPLEMENTS</span>
    </div>

    <div class="login-title">
      Admin Dashboard Login
    </div>

    <div id="loginError" class="login-error"></div>

    <input
      type="text"
      id="username"
      placeholder="Admin Username"
      autocomplete="username"
    >

    <input
      type="password"
      id="password"
      placeholder="Admin Password"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      onclick="adminLogin()"
    >
      🔐 Login
    </button>

  </div>

</div>


<!-- =====================================================
     ADMIN DASHBOARD
===================================================== -->

<div id="dashboard" class="hidden">

<header class="header">

  <div class="logo">
    SHIV <span>SUPPLEMENTS</span>
  </div>

  <div class="admin-area">

    <div class="admin-label">
      ADMIN DASHBOARD
    </div>

    <button
      class="logout-btn"
      onclick="adminLogout()"
    >
      Logout
    </button>

  </div>

</header>


<div class="container">

  <h1 class="title">
    📦 Admin <span>Orders</span>
  </h1>


  <!-- STATS -->

  <div class="stats">

    <div class="card">
      <h3>Total Orders</h3>
      <div
        class="number"
        id="totalOrders"
      >
        0
      </div>
    </div>

    <div class="card">
      <h3>Pending</h3>
      <div
        class="number"
        id="pendingOrders"
      >
        0
      </div>
    </div>

    <div class="card">
      <h3>Paid</h3>
      <div
        class="number"
        id="paidOrders"
      >
        0
      </div>
    </div>

    <div class="card">
      <h3>Total Sales</h3>
      <div
        class="number"
        id="totalSales"
      >
        ₹0
      </div>
    </div>

  </div>


  <!-- SEARCH -->

  <div class="controls">

    <input
      type="text"
      id="search"
      placeholder="Search customer, phone, email or order ID..."
      oninput="renderOrders()"
    >

    <button
      class="refresh"
      onclick="loadOrders()"
    >
      🔄 Refresh Orders
    </button>

  </div>


  <!-- ORDERS -->

  <div
    class="orders"
    id="orders"
  >

    <div class="loading">
      Loading orders...
    </div>

  </div>

</div>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="toast"
></div>


<script>

let allOrders = [];


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  },3000);

}


/* =====================================================
   LOGIN ERROR
===================================================== */

function showLoginError(message){

  const box =
    document.getElementById("loginError");

  box.textContent = message;

  box.style.display = "block";

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function adminLogin(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("loginError");

  errorBox.style.display = "none";

  if(!username || !password){

    showLoginError(
      "Username and password are required."
    );

    return;
  }

  try{

    const response =
      await fetch(
        "/api/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          credentials:"same-origin",

          body:JSON.stringify({
            username,
            password
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok || data.success === false){

      throw new Error(
        data.message ||
        "Login failed"
      );

    }

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("dashboard")
      .classList.remove("hidden");

    await loadOrders();

  }
  catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );

    showLoginError(
      error.message ||
      "Login failed"
    );

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function adminLogout(){

  try{

    await fetch(
      "/api/admin/logout",
      {
        method:"POST",
        credentials:"same-origin"
      }
    );

  }
  catch(error){

    console.error(error);

  }

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("username")
    .value = "";

  document
    .getElementById("password")
    .value = "";

}


/* =====================================================
   CHECK ADMIN SESSION
===================================================== */

async function checkAdminSession(){

  try{

    const response =
      await fetch(
        "/api/admin/me",
        {
          credentials:"same-origin"
        }
      );

    const data =
      await response.json();

    if(
      data.success &&
      data.loggedIn
    ){

      document
        .getElementById("loginScreen")
        .classList.add("hidden");

      document
        .getElementById("dashboard")
        .classList.remove("hidden");

      await loadOrders();

    }
    else{

      document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    }

  }
  catch(error){

    console.error(
      "SESSION CHECK ERROR:",
      error
    );

    document
      .getElementById("loginScreen")
      .classList.remove("hidden");

  }

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

  const box =
    document.getElementById("orders");

  box.innerHTML = `
    <div class="loading">
      Loading orders...
    </div>
  `;

  try{

    const response =
      await fetch(
        "/api/admin/orders",
        {
          credentials:"same-origin",
          cache:"no-store"
        }
      );


    /* SESSION EXPIRED */

    if(response.status === 401){

      document
        .getElementById("dashboard")
        .classList.add("hidden");

      document
        .getElementById("loginScreen")
        .classList.remove("hidden");

      throw new Error(
        "Admin login required. Please login again."
      );

    }


    let data;

    try{

      data =
        await response.json();

    }
    catch(jsonError){

      throw new Error(
        "Server returned an invalid response."
      );

    }


    if(!response.ok){

      throw new Error(
        data.message ||
        "Could not load orders."
      );

    }


    if(data.success === false){

      throw new Error(
        data.message ||
        "Could not load orders."
      );

    }


    if(Array.isArray(data)){

      allOrders = data;

    }
    else{

      allOrders =
        Array.isArray(data.orders)
          ? data.orders
          : [];

    }


    updateStats();

    renderOrders();

  }
  catch(error){

    console.error(
      "LOAD ORDERS ERROR:",
      error
    );

    box.innerHTML = `

      <div class="server-error">

        ❌ <b>Could not load orders.</b>

        <br><br>

        ${escapeHTML(
          error.message ||
          "Unknown server error"
        )}

        <br><br>

        <button
          class="refresh"
          onclick="loadOrders()"
        >
          🔄 Try Again
        </button>

      </div>

    `;

  }

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

  const total =
    allOrders.length;


  const pending =
    allOrders.filter(order => {

      const status =
        String(
          order.status ||
          order.payment_status ||
          "pending"
        ).toLowerCase();

      return status === "pending";

    }).length;


  const paid =
    allOrders.filter(order => {

      const status =
        String(
          order.status ||
          order.payment_status ||
          ""
        ).toLowerCase();

      return status === "paid";

    }).length;


  let sales = 0;


  allOrders.forEach(order => {

    let amount =
      Number(order.amount);


    if(!Number.isFinite(amount)){

      amount =
        Number(order.total);

    }


    if(!Number.isFinite(amount)){

      amount =
        Number(order.total_amount);

    }


    if(!Number.isFinite(amount)){

      const paise =
        Number(order.amount_paise);

      if(Number.isFinite(paise)){

        amount =
          paise / 100;

      }

    }


    if(Number.isFinite(amount)){

      sales += amount;

    }

  });


  document
    .getElementById("totalOrders")
    .textContent = total;


  document
    .getElementById("pendingOrders")
    .textContent = pending;


  document
    .getElementById("paidOrders")
    .textContent = paid;


  document
    .getElementById("totalSales")
    .textContent =
      "₹" +
      sales.toLocaleString("en-IN");

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(){

  const box =
    document.getElementById("orders");


  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    allOrders.filter(order => {

      const text =
        JSON.stringify(order)
          .toLowerCase();

      return text.includes(search);

    });


  if(filtered.length === 0){

    box.innerHTML = `

      <div class="empty">

        📭 No orders found.

      </div>

    `;

    return;

  }


  box.innerHTML =
    filtered
      .map(
        (order,index) =>
          renderSingleOrder(
            order,
            index
          )
      )
      .join("");

}


/* =====================================================
   SINGLE ORDER
===================================================== */

function renderSingleOrder(
  order,
  index
){

  const orderId =
    order.id ||
    order.order_id ||
    order._id ||
    ("ORDER-" + (index + 1));


  const name =
    order.name ||
    order.customer_name ||
    order.customerName ||
    "Customer";


  const phone =
    order.phone ||
    order.mobile ||
    order.customer_phone ||
    "-";


  const email =
    order.email ||
    order.customer_email ||
    "-";


  const address =
    order.address ||
    order.delivery_address ||
    "-";


  const status =
    String(
      order.status ||
      order.payment_status ||
      "pending"
    ).toLowerCase();


  let amount =
    Number(order.amount);


  if(!Number.isFinite(amount)){

    const paise =
      Number(order.amount_paise);

    if(Number.isFinite(paise)){

      amount =
        paise / 100;

    }

  }


  if(!Number.isFinite(amount)){

    amount =
      Number(order.total) || 0;

  }


  const products =
    Array.isArray(order.items)
      ? order.items
      : (
        Array.isArray(order.products)
          ? order.products
          : []
      );


  let productHTML = "";


  if(products.length){

    productHTML =
      products
        .map(product => {

          const productName =
            product.name ||
            product.title ||
            product.product_name ||
            "Product";


          const quantity =
            Number(
              product.qty ||
              product.quantity ||
              1
            );


          const price =
            Number(
              product.price ||
              product.amount ||
              0
            );


          return `

            <div class="product">

              <span>

                ${escapeHTML(
                  productName
                )}

                ×

                ${escapeHTML(
                  String(quantity)
                )}

              </span>

              <span>

                ₹${price.toLocaleString(
                  "en-IN"
                )}

              </span>

            </div>

          `;

        })
        .join("");

  }
  else{

    productHTML = `

      <div class="product">

        <span>
          Order items
        </span>

        <span>
          —
        </span>

      </div>

    `;

  }


  let paymentHTML = "";


  const paymentRef =
    order.payment_ref ||
    order.utr ||
    order.payment_reference ||
    "";


  const paymentMethod =
    order.payment_method ||
    "UPI";


  if(paymentRef){

    paymentHTML = `

      <div class="payment">

        <div class="payment-title">
          Payment Method
        </div>

        <div>
          ${escapeHTML(
            String(paymentMethod)
          )}
        </div>

        <br>

        <div class="payment-title">
          UTR / Payment Reference
        </div>

        <div class="payment-ref">
          ${escapeHTML(
            String(paymentRef)
          )}
        </div>

      </div>

    `;

  }


  let actionHTML = "";


  /* PENDING */

  if(status === "pending"){

    actionHTML = `

      <div class="actions">

        <div class="action-title">
          💳 Payment Action
        </div>

        <button
          class="approve-btn"
          onclick="approvePayment('${escapeJS(
            String(orderId)
          )}')"
        >
          ✅ Approve Payment
        </button>

        <button
          class="reject-btn"
          onclick="updateOrderStatus(
            '${escapeJS(String(orderId))}',
            'cancelled'
          )"
        >
          ❌ Reject
        </button>

      </div>

    `;

  }


  /* PAID */

  else if(status === "paid"){

    actionHTML = `

      <div class="actions">

        <div class="action-title">
          📦 Order Processing
        </div>

        <button
          class="processing-btn"
          onclick="updateOrderStatus(
            '${escapeJS(String(orderId))}',
            'processing'
          )"
        >
          ⚙️ Mark Processing
        </button>

        <button
          class="ship-btn"
          onclick="updateOrderStatus(
            '${escapeJS(String(orderId))}',
            'shipped'
          )"
        >
          🚚 Mark Shipped
        </button>

        <button
          class="reject-btn"
          onclick="updateOrderStatus(
            '${escapeJS(String(orderId))}',
            'cancelled'
          )"
        >
          ❌ Cancel
        </button>

      </div>

    `;

  }


  /* PROCESSING */

  else if(status === "processing"){

    actionHTML = `

      <div class="actions">

        <div class="action-title">
          📦 Order Processing
        </div>

        <button
          class="ship-btn"
          onclick="updateOrderStatus(
            '${escapeJS(String(orderId))}',
            'shipped'
          )"
        >
          🚚 Mark Shipped
        </button>

        <button
          class="reject-btn"
          onclick="updateOrderStatus(
            '${escapeJS(String(orderId))}',
            'cancelled'
          )"
        >
          ❌ Cancel
        </button>

      </div>

    `;

  }


  /* SHIPPED */

  else if(status === "shipped"){

    actionHTML = `

      <div class="actions">

        <div class="action-title">
          🚚 Delivery
        </div>

        <button
          class="deliver-btn"
          onclick="updateOrderStatus(
            '${escapeJS(String(orderId))}',
            'delivered'
          )"
        >
          ✅ Mark Delivered
        </button>

      </div>

    `;

  }


  /* DELIVERED */

  else if(status === "delivered"){

    actionHTML = `

      <div class="actions">

        <div class="action-title">
          ✅ Order Completed
        </div>

        <button
          class="deliver-btn disabled-btn"
          disabled
        >
          ✓ Delivered
        </button>

      </div>

    `;

  }


  /* CANCELLED */

  else if(
    status === "cancelled" ||
    status === "canceled"
  ){

    actionHTML = `

      <div class="actions">

        <div class="action-title">
          ❌ Order Cancelled
        </div>

        <button
          class="reject-btn disabled-btn"
          disabled
        >
          Cancelled
        </button>

      </div>

    `;

  }


  return `

    <div class="order">

      <div class="order-top">

        <div>

          <div class="order-id">

            Order #${escapeHTML(
              String(orderId)
            )}

          </div>

          <div
            style="
              color:#777;
              margin-top:5px;
            "
          >

            ${formatDate(
              order.created_at ||
              order.createdAt ||
              order.date
            )}

          </div>

        </div>


        <div>

          <span
            class="status ${statusClass(status)}"
          >

            ${escapeHTML(
              status.toUpperCase()
            )}

          </span>

        </div>

      </div>


      <!-- CUSTOMER -->

      <div class="customer">

        👤
        <b>
          ${escapeHTML(
            String(name)
          )}
        </b>

        <br>

        📱
        ${escapeHTML(
          String(phone)
        )}

        <br>

        📧
        ${escapeHTML(
          String(email)
        )}

        <br>

        📍
        ${escapeHTML(
          String(address)
        )}

      </div>


      <!-- PRODUCTS -->

      <div class="products">

        <b>
          🛒 Products
        </b>

        <div
          style="margin-top:10px"
        >

          ${productHTML}

        </div>

      </div>


      <!-- PAYMENT -->

      ${paymentHTML}


      <!-- AMOUNT -->

      <div class="amount">

        Total:

        ₹${amount.toLocaleString(
          "en-IN"
        )}

      </div>


      <!-- ACTIONS -->

      ${actionHTML}

    </div>

  `;

}


/* =====================================================
   APPROVE PAYMENT
===================================================== */

async function approvePayment(orderId){

  if(
    !confirm(
      "Approve this payment?\n\n" +
      "The order will be marked as PAID."
    )
  ){

    return;

  }


  try{

    showToast(
      "Approving payment..."
    );


    const response =
      await fetch(
        "/api/admin/orders/" +
        encodeURIComponent(orderId) +
        "/approve-payment",
        {
          method:"PATCH",

          credentials:"same-origin",

          headers:{
            "Content-Type":
              "application/json"
          }
        }
      );


    const data =
      await response.json();


    if(
      response.status === 401
    ){

      alert(
        "Admin login expired. Please login again."
      );

      adminLogout();

      return;

    }


    if(
      !response.ok ||
      data.success === false
    ){

      throw new Error(
        data.message ||
        "Could not approve payment"
      );

    }


    showToast(
      "✅ Payment approved successfully!"
    );


    await loadOrders();

  }
  catch(error){

    console.error(
      "APPROVE PAYMENT ERROR:",
      error
    );

    alert(
      "❌ Payment approval failed.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   UPDATE ORDER STATUS
===================================================== */

async function updateOrderStatus(
  orderId,
  status
){

  let message =
    "Update order status?";


  if(status === "cancelled"){

    message =
      "Reject/cancel this order?";

  }

  else if(status === "processing"){

    message =
      "Mark this order as PROCESSING?";

  }

  else if(status === "shipped"){

    message =
      "Mark this order as SHIPPED?";

  }

  else if(status === "delivered"){

    message =
      "Mark this order as DELIVERED?";

  }


  if(!confirm(message)){

    return;

  }


  try{

    showToast(
      "Updating order..."
    );


    const response =
      await fetch(
        "/api/admin/orders/" +
        encodeURIComponent(orderId),
        {
          method:"PATCH",

          credentials:"same-origin",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            status:status
          })
        }
      );


    const data =
      await response.json();


    if(
      response.status === 401
    ){

      alert(
        "Admin login expired. Please login again."
      );

      adminLogout();

      return;

    }


    if(
      !response.ok ||
      data.success === false
    ){

      throw new Error(
        data.message ||
        "Could not update order"
      );

    }


    showToast(
      "✅ Order updated successfully!"
    );


    await loadOrders();

  }
  catch(error){

    console.error(
      "UPDATE ORDER ERROR:",
      error
    );

    alert(
      "❌ Update failed.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(status){

  if(status === "paid")
    return "paid";

  if(status === "processing")
    return "processing";

  if(status === "shipped")
    return "shipped";

  if(status === "delivered")
    return "delivered";

  if(
    status === "cancelled" ||
    status === "canceled"
  )
    return "cancelled";

  return "pending";

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value){

    return "";

  }


  try{

    const date =
      new Date(value);


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return String(value);

    }


    return date.toLocaleString(
      "en-IN",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    );

  }
  catch{

    return String(value);

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJS(value){

  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}
