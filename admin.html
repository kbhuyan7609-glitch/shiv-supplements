<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiv Supplements - Admin Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#090b10;
  color:#fff;
  min-height:100vh;
}

.header{
  background:#11151d;
  border-bottom:2px solid #ffb000;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#ffb000;
}

.admin{
  color:#aaa;
  font-size:14px;
}

.container{
  width:92%;
  max-width:1400px;
  margin:30px auto;
}

.title{
  font-size:32px;
  margin-bottom:25px;
}

.title span{
  color:#ffb000;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:30px;
}

.card{
  background:#151c27;
  border:1px solid #263447;
  border-radius:16px;
  padding:24px;
}

.card h3{
  color:#aaa;
  font-size:15px;
  margin-bottom:12px;
}

.card .number{
  font-size:30px;
  font-weight:bold;
}

.controls{
  display:flex;
  gap:12px;
  margin-bottom:20px;
}

input{
  flex:1;
  background:#111722;
  color:white;
  border:1px solid #33445b;
  padding:14px;
  border-radius:10px;
  outline:none;
}

button{
  border:none;
  border-radius:10px;
  padding:13px 20px;
  font-weight:bold;
  cursor:pointer;
}

.refresh{
  background:#ffb000;
  color:#111;
}

.orders{
  background:#111722;
  border:1px solid #263447;
  border-radius:16px;
  overflow:hidden;
}

.order{
  padding:22px;
  border-bottom:1px solid #263447;
}

.order:last-child{
  border-bottom:none;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.order-id{
  font-weight:bold;
  color:#ffb000;
}

.customer{
  margin-top:15px;
  line-height:1.8;
  color:#ddd;
}

.products{
  margin-top:15px;
  padding:15px;
  background:#0b0f16;
  border-radius:10px;
}

.product{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid #202a38;
}

.product:last-child{
  border-bottom:none;
}

.amount{
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
  color:#ffb000;
}

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#4b3500;
  color:#ffc400;
}

.paid{
  background:#063d27;
  color:#37e69a;
}

.shipped{
  background:#073b58;
  color:#55c7ff;
}

.delivered{
  background:#233b12;
  color:#9cff50;
}

.cancelled{
  background:#4a1111;
  color:#ff6b6b;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:#888;
}

.loading{
  text-align:center;
  padding:40px;
  color:#aaa;
}

@media(max-width:900px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }

  .controls{
    flex-direction:column;
  }

  .title{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    SHIV <span>SUPPLEMENTS</span>
  </div>
  <div class="admin">ADMIN DASHBOARD</div>
</header>

<div class="container">

  <h1 class="title">
    📦 Admin <span>Orders</span>
  </h1>

  <div class="stats">

    <div class="card">
      <h3>Total Orders</h3>
      <div class="number" id="totalOrders">0</div>
    </div>

    <div class="card">
      <h3>Pending</h3>
      <div class="number" id="pendingOrders">0</div>
    </div>

    <div class="card">
      <h3>Paid</h3>
      <div class="number" id="paidOrders">0</div>
    </div>

    <div class="card">
      <h3>Total Sales</h3>
      <div class="number" id="totalSales">₹0</div>
    </div>

  </div>

  <div class="controls">
    <input
      type="text"
      id="search"
      placeholder="Search customer, phone, email or order ID..."
      oninput="renderOrders()"
    >

    <button class="refresh" onclick="loadOrders()">
      🔄 Refresh Orders
    </button>
  </div>

  <div class="orders" id="orders">
    <div class="loading">
      Loading orders...
    </div>
  </div>

</div>

<script>

let allOrders = [];

/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  const box = document.getElementById("orders");

  box.innerHTML = `
    <div class="loading">
      Loading orders...
    </div>
  `;

  try{

    const response = await fetch("/api/admin/orders");

    if(!response.ok){
      throw new Error("Server error");
    }

    const data = await response.json();

    /*
      API can return:
      {success:true, orders:[...]}
      OR directly [...]
    */

    if(Array.isArray(data)){
      allOrders = data;
    }
    else{
      allOrders = data.orders || [];
    }

    updateStats();
    renderOrders();

  }
  catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="empty">
        ❌ Could not load orders.<br><br>
        Please refresh the page.
      </div>
    `;

  }
}


/* =========================
   STATS
========================= */

function updateStats(){

  const total = allOrders.length;

  const pending = allOrders.filter(o => {

    const s = String(
      o.status ||
      o.payment_status ||
      ""
    ).toLowerCase();

    return s === "pending";

  }).length;

  const paid = allOrders.filter(o => {

    const s = String(
      o.status ||
      o.payment_status ||
      ""
    ).toLowerCase();

    return s === "paid";

  }).length;

  let sales = 0;

  allOrders.forEach(o => {

    const amount =
      Number(
        o.total ||
        o.amount ||
        o.total_amount ||
        o.price ||
        0
      );

    sales += amount;

  });

  document.getElementById("totalOrders").textContent = total;

  document.getElementById("pendingOrders").textContent = pending;

  document.getElementById("paidOrders").textContent = paid;

  document.getElementById("totalSales").textContent =
    "₹" + sales.toLocaleString("en-IN");

}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(){

  const box = document.getElementById("orders");

  const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const filtered = allOrders.filter(order => {

    const text = JSON.stringify(order).toLowerCase();

    return text.includes(search);

  });

  if(filtered.length === 0){

    box.innerHTML = `
      <div class="empty">
        📭 No orders found.
      </div>
    `;

    return;
  }

  box.innerHTML = filtered.map((order,index) => {

    const orderId =
      order.order_id ||
      order.id ||
      order._id ||
      ("ORDER-" + (index + 1));

    const name =
      order.name ||
      order.customer_name ||
      order.customerName ||
      "Customer";

    const phone =
      order.phone ||
      order.mobile ||
      order.customer_phone ||
      "-";

    const email =
      order.email ||
      order.customer_email ||
      "-";

    const address =
      order.address ||
      order.delivery_address ||
      "-";

    const status =
      String(
        order.status ||
        order.payment_status ||
        "pending"
      ).toLowerCase();

    const amount =
      Number(
        order.total ||
        order.amount ||
        order.total_amount ||
        order.price ||
        0
      );

    const products =
      order.items ||
      order.products ||
      [];

    let productHTML = "";

    if(Array.isArray(products) && products.length){

      productHTML = products.map(p => {

        const pname =
          p.name ||
          p.title ||
          p.product_name ||
          "Product";

        const qty =
          p.qty ||
          p.quantity ||
          1;

        const price =
          Number(
            p.price ||
            p.amount ||
            0
          );

        return `
          <div class="product">
            <span>
              ${escapeHTML(pname)}
              × ${qty}
            </span>

            <span>
              ₹${price.toLocaleString("en-IN")}
            </span>
          </div>
        `;

      }).join("");

    }
    else{

      productHTML = `
        <div class="product">
          <span>Order items</span>
          <span>View order data</span>
        </div>
      `;

    }

    return `

      <div class="order">

        <div class="order-top">

          <div>
            <div class="order-id">
              ${escapeHTML(String(orderId))}
            </div>

            <div style="color:#777;margin-top:5px">
              ${formatDate(order.created_at || order.createdAt || order.date)}
            </div>
          </div>

          <div>
            <span class="status ${statusClass(status)}">
              ${status.toUpperCase()}
            </span>
          </div>

        </div>

        <div class="customer">

          👤 <b>${escapeHTML(String(name))}</b><br>

          📱 ${escapeHTML(String(phone))}<br>

          📧 ${escapeHTML(String(email))}<br>

          📍 ${escapeHTML(String(address))}

        </div>

        <div class="products">

          <b>🛒 Products</b>

          <div style="margin-top:10px">
            ${productHTML}
          </div>

        </div>

        <div class="amount">
          Total: ₹${amount.toLocaleString("en-IN")}
        </div>

      </div>

    `;

  }).join("");

}


/* =========================
   HELPERS
========================= */

function statusClass(status){

  if(
    status === "paid"
  ) return "paid";

  if(
    status === "shipped"
  ) return "shipped";

  if(
    status === "delivered"
  ) return "delivered";

  if(
    status === "cancelled" ||
    status === "canceled"
  ) return "cancelled";

  return "pending";

}


function formatDate(value){

  if(!value){
    return "";
  }

  try{

    return new Date(value).toLocaleString(
      "en-IN",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    );

  }
  catch{
    return String(value);
  }

}


function escapeHTML(value){

  return value
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadOrders();

</script>

</body>
</html>
